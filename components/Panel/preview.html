<!doctype html>
<html>
<head><meta charset="utf-8"><title>Panel — preview</title>
<style>body{margin:0}.wrap{padding:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}</style>
</head>
<body class="fd-root">
<div id="root" class="wrap"></div>
<script>
  var F = window.Flipdisc, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(F.Panel, { label: '01 · Speed', title: 'Fast by default' }, 'No images, no web fonts. Every disc is one CSS circle.'),
    h(F.Panel, { label: '02 · Status', title: 'Live on the board', tone: 'board' },
      h('div', { style: { display: 'grid', gap: 12 } },
        h(F.DiscDisplay, { text: 'ON TIME', pitch: 'sm', boot: false }),
        'Board-tone panels stay black in every theme.'))
  ));
</script>
</body>
</html>
