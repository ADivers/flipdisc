<!-- @dsCard group="Pages" height=1500 width=1200 page subtitle="A full landing page built from the system" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Homepage — preview</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{margin:0}
  .hp-col{max-width:1104px;margin:0 auto;padding-left:var(--space-6);padding-right:var(--space-6)}
  .hp-hero{padding-top:var(--space-16);padding-bottom:var(--space-12);display:grid;gap:var(--space-8)}
  .hp-hero-copy{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-6);align-items:end}
  .hp-h1{margin:0;font-size:40px;line-height:44px;font-weight:700;letter-spacing:-.02em}
  .hp-lede{margin:var(--space-3) 0 0;font-size:20px;line-height:30px;color:var(--ink-muted);max-width:60ch}
  .hp-ctas{display:flex;gap:var(--space-3);flex-wrap:wrap}
  .hp-section{padding-top:var(--space-12);padding-bottom:var(--space-12);border-top:1px solid var(--line)}
  .hp-head{display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-4);flex-wrap:wrap;margin-bottom:var(--space-6)}
  .hp-h2{margin:var(--space-2) 0 0;font-size:28px;line-height:32px;font-weight:700;letter-spacing:-.01em}
  .hp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--space-4)}
  .hp-sched{background:var(--housing);border-radius:var(--radius-sm);padding:var(--space-4);display:grid;gap:var(--space-2);overflow-x:auto}
  .hp-sched-head,.hp-sched-row{display:grid;grid-template-columns:174px 354px 1fr;gap:var(--space-2);align-items:center;min-width:720px}
  .hp-sched-head .fd-label{color:var(--board-muted);padding-left:var(--space-1)}
  .hp-sched-row .fd-board{padding-left:0;padding-right:0}
  .hp-split{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:var(--space-8);align-items:center}
  .hp-list{margin:0;padding:0;list-style:none;display:grid;gap:var(--space-3)}
  .hp-foot{border-top:1px solid var(--line);padding-top:var(--space-8);padding-bottom:var(--space-8);display:flex;justify-content:space-between;align-items:center;gap:var(--space-4);flex-wrap:wrap}
  .hp-small{font-size:14px;line-height:20px;color:var(--ink-muted)}
  @media (max-width:720px){.hp-hero-copy{grid-template-columns:1fr}.hp-h1{font-size:32px;line-height:36px}}
</style>
</head>
<body class="fd-root">
<div id="root"></div>
<script>
  var F = window.Flipdisc, h = React.createElement;
  var rows = [
    ['09:40', 'REVIEW', 'ON TIME', 'white'],
    ['11:15', 'BUILD 2.4', 'BOARDING', 'orange'],
    ['14:00', 'LAUNCH', 'ON TIME', 'white'],
    ['16:30', 'RETRO', 'DELAYED', 'orange']
  ];
  function SchedRow(r, i) {
    return h('div', { className: 'hp-sched-row', key: i },
      h(F.DiscDisplay, { text: r[0], pitch: 6, cols: 29, boot: true, stagger: 10 }),
      h(F.DiscDisplay, { text: r[1], pitch: 6, cols: 59, boot: true, stagger: 10 }),
      h(F.DiscDisplay, { text: r[2], pitch: 6, color: r[3], boot: true, stagger: 10 }));
  }
  function Page() {
    return h('div', null,
      h(F.NavBar, {
        brand: 'FLIPDISC',
        links: [{ label: 'Home', active: true }, { label: 'Schedule' }, { label: 'Work' }, { label: 'About' }],
        action: h(F.Button, { size: 'sm' }, 'Get in touch')
      }),
      h('main', null,
        h('section', { className: 'hp-col hp-hero' },
          h(F.DiscDisplay, { messages: ['HELLO, WORLD', 'SIMPLE TO READ', 'FAST TO LOAD'], fit: true, align: 'center', cols: 84 }),
          h('div', { className: 'hp-hero-copy' },
            h('div', null,
              h('div', { className: 'fd-label' }, 'A website, built like a sign'),
              h('h1', { className: 'hp-h1', style: { marginTop: 8 } }, 'One message at a time, readable from across the room.'),
              h('p', { className: 'hp-lede' }, 'Every disc on this page is a single CSS circle. No images, no web fonts, nothing to wait for.')),
            h('div', { className: 'hp-ctas' },
              h(F.Button, null, 'Get started'),
              h(F.Button, { variant: 'secondary', dot: true }, 'View schedule')))),
        h('section', { className: 'hp-col hp-section' },
          h('div', { className: 'hp-head' },
            h('div', null, h('div', { className: 'fd-label' }, 'Why it works'), h('h2', { className: 'hp-h2' }, 'Three rules, no exceptions'))),
          h('div', { className: 'hp-grid' },
            h(F.Panel, { label: '01 · Speed', title: 'Fast by default' }, 'System fonts and plain HTML. The heaviest thing on the page is a stylesheet.'),
            h(F.Panel, { label: '02 · Colour', title: 'Black, white, orange' }, 'Black is the ground, white is information, orange is the signal. Nothing else.'),
            h(F.Panel, { label: '03 · Motion', title: 'Discs flip, nothing fades', tone: 'board' }, 'One mechanical motion — a 180ms flip, column by column — and it stops for reduced motion.'))),
        h('section', { className: 'hp-col hp-section' },
          h('div', { className: 'hp-head' },
            h('div', null, h('div', { className: 'fd-label' }, 'Departures'), h('h2', { className: 'hp-h2' }, 'Today')),
            h(F.StatusDisc, { state: 'on' }, 'Updated 14:32')),
          h('div', { className: 'hp-sched', role: 'table', 'aria-label': 'Today’s schedule' },
            h('div', { className: 'hp-sched-head' },
              h('span', { className: 'fd-label' }, 'Time'), h('span', { className: 'fd-label' }, 'Event'), h('span', { className: 'fd-label' }, 'Status')),
            rows.map(SchedRow))),
        h('section', { className: 'hp-col hp-section' },
          h('div', { className: 'hp-split' },
            h('div', null,
              h('div', { className: 'fd-label' }, 'Start here'),
              h('h2', { className: 'hp-h2' }, 'Put your message on the board.'),
              h('p', { className: 'hp-lede' }, 'Short, in capitals, and one at a time. Everything else goes in plain text beside it.')),
            h('ul', { className: 'hp-list' },
              h('li', null, h(F.StatusDisc, { state: 'on' }, 'Under 16 characters per message')),
              h('li', null, h(F.StatusDisc, { state: 'on' }, 'One cycling board per screen')),
              h('li', null, h(F.StatusDisc, { state: 'alert' }, 'Orange only for what must stand out')),
              h('li', null, h('div', { style: { marginTop: 8 } }, h(F.Button, null, 'Get started')))))),
        h('footer', { className: 'hp-col hp-foot' },
          h(F.DiscDisplay, { text: 'THANK YOU', pitch: 'sm', color: 'orange', boot: false }),
          h('span', { className: 'hp-small' }, '© 2026 Flipdisc. Built with circles.'))));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Page));
</script>
</body>
</html>
