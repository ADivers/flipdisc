<!doctype html>
<html>
<head><meta charset="utf-8"><title>DiscDisplay — preview</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ccircle cx=%278%27 cy=%278%27 r=%277%27 fill=%27%23ff6a00%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components/bundle.css">
<script src="../../vendor/react.production.min.js"></script>
<script src="../../vendor/react-dom.production.min.js"></script>
<script src="../../components/bundle.js"></script>
<script>
(function(){
  var k='fd-theme',t;try{t=localStorage.getItem(k)}catch(e){}
  if(t)document.documentElement.setAttribute('data-theme',t);
  window.fdToggleTheme=function(){
    var n=document.documentElement.getAttribute('data-theme')==='paper'?'board':'paper';
    document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem(k,n)}catch(e){}
  };
})();
</script>

<style>body{margin:0}.wrap{padding:24px;display:grid;gap:16px}.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}</style>
</head>
<body class="fd-root">
<div id="root" class="wrap"></div>
<script>
  var F = window.Flipdisc, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(F.DiscDisplay, { messages: ['HELLO, WORLD', 'SIMPLE TO READ', 'FAST TO LOAD'], fit: true, align: 'center' }),
    h('div', { className: 'row' },
      h(F.DiscDisplay, { text: 'PLATFORM 04', color: 'orange', pitch: 'md' }),
      h(F.DiscDisplay, { text: 'ON TIME', pitch: 'sm' }),
      h(F.DiscDisplay, { text: 'DELAYED', pitch: 'sm', color: 'orange' }))
  ));
</script>
</body>
</html>
